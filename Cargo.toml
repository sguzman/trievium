[package]
name = "trievium"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "A keyboard-first prefix-tree selection launcher for Wayland"
repository = "https://github.com/sguzman/trievium"

[dependencies]
anyhow = "1"
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "system_fonts", "wayland", "x11"] }
portal-theme = "=0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
