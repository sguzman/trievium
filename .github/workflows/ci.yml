name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl-dev libgl-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-render0-dev pkg-config lua5.4 sway wtype wl-clipboard libgl1-mesa-dri
      - name: Format
        run: cargo fmt --all -- --check
      - name: Validate locked dependency graph
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: CLI smoke test
        run: |
          cargo build --locked
          config="$RUNNER_TEMP/trievium-ci-items.json"
          ./target/debug/trievium --version

          # Command registry must be independent from the existing copy library.
          commands="$RUNNER_TEMP/trievium-ci-commands.json"
          ./target/debug/trievium commands --help | grep -F 'Usage: trievium commands'
          ./target/debug/trievium commands -h | grep -F 'Usage: trievium commands'
          ./target/debug/trievium commands --version | grep -F 'trievium '
          ./target/debug/trievium commands -V | grep -F 'trievium '
          test ! -e "$commands"
          test ! -e "$config"
          ./target/debug/trievium commands init --config "$commands"
          ./target/debug/trievium commands validate --config "$commands"
          ./target/debug/trievium commands config-path --config "$commands" | grep -Fx "$commands"
          if ./target/debug/trievium commands init --config "$commands"; then
            echo "command init unexpectedly overwrote the registry" >&2
            exit 1
          fi
          test ! -e "$config"
          # Bare relative command registry paths must initialize correctly,
          # independently of the original copy configuration.
          (
            cd "$RUNNER_TEMP"
            "$GITHUB_WORKSPACE/target/debug/trievium" commands init --config "trievium-relative-commands.json"
            "$GITHUB_WORKSPACE/target/debug/trievium" commands validate --config "trievium-relative-commands.json"
            test -f "trievium-relative-commands.json"
          )
          test ! -e "$config"
          ./target/debug/trievium init --config "$config"
          ./target/debug/trievium validate --config "$config"
          ./target/debug/trievium validate --config "$config" --theme light
          ./target/debug/trievium validate --config "$config" --theme dark
          ./target/debug/trievium validate --config "$config" --theme system
          if ./target/debug/trievium validate --config "$config" --theme blue; then
            echo "invalid theme unexpectedly accepted" >&2
            exit 1
          fi
          if ./target/debug/trievium init --config "$config"; then
            echo "init unexpectedly overwrote existing config" >&2
            exit 1
          fi
      - name: Headless Wayland keyboard integration
        run: bash scripts/wayland-smoke.sh
      - name: Release binary
        run: cargo build --release --locked
      - name: Package and verify Linux x86_64
        run: |
          mkdir -p dist/trievium
          cp target/release/trievium LICENSE dist/trievium/
          tar -C dist -czf dist/trievium-linux-x86_64.tar.gz trievium
          (cd dist && sha256sum trievium-linux-x86_64.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: trievium-linux-x86_64
          path: |
            dist/trievium-linux-x86_64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    # Only explicit release commits on main can publish; all checks must pass first.
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: trievium-linux-x86_64
          path: dist
      - name: Verify source version and archive checksum
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^\[package\]$/ { p=1; next } /^\[/ && p { exit } p && /^version = / { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)
          test -n "$version"
          test -f "docs/releases/v${version}.md"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Annotate release tag and publish the checked artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(awk '/^\[package\]$/ { p=1; next } /^\[/ && p { exit } p && /^version = / { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null 2>&1; then
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}" || git fetch origin tag "${tag}"
            target=$(git rev-list -n 1 "${tag}")
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "Refusing to retarget existing tag ${tag} (points to ${target})" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" -m "Trievium ${tag} stable release"
            git push origin "refs/tags/${tag}"
          fi
          if gh release view "${tag}" > /dev/null 2>&1; then
            echo "Release already published at verified tag: ${tag}"
            exit 0
          fi
          gh release create "${tag}" dist/trievium-linux-x86_64.tar.gz dist/SHA256SUMS \
            --title "Trievium ${tag}" --notes-file "docs/releases/${tag}.md" --verify-tag
